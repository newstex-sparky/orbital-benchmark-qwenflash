<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Solar System — Full-Scale Model</title>
<meta name="description" content="A high-fidelity, full-scale 3D model of our solar system. Real orbital data, planet textures, moon systems, and a dropdown to navigate." />
<style>
  :root {
    --accent: #5fd9ff;
    --accent2: #c9a0ff;
    --panel: rgba(8, 14, 26, 0.72);
    --panel-border: rgba(120, 200, 255, 0.18);
    --text: #d7ecff;
    --muted: #7fa3c4;
    --glow: 0 0 18px rgba(95, 217, 255, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #010208;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .hud { position: absolute; pointer-events: none; z-index: 10; }
  .hud * { pointer-events: none; }

  #title { top: 22px; left: 28px; }
  #title h1 {
    font-size: 19px; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase; color: #eaf7ff;
    text-shadow: 0 0 24px rgba(95, 217, 255, 0.6);
  }
  #title .sub { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); margin-top: 4px; }
  /* Current-view indicator pill */
  .view-ind {
    margin-top: 10px; display: inline-flex; align-items: center; gap: 7px;
    background: rgba(8,14,26,0.7); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 4px 11px; font-size: 11px;
    font-weight: 600; letter-spacing: 1px; color: var(--text);
    backdrop-filter: blur(6px);
  }
  .view-ind-icon { font-size: 13px; line-height: 1; }
  #view-ind-text { transition: color 0.2s ease; }

  /* Dropdown */
  #nav { top: 22px; right: 28px; pointer-events: auto; }
  #nav select {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 9px 12px;
    backdrop-filter: blur(8px);
    cursor: pointer;
    outline: none;
    min-width: 180px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.45);
  }
  #nav select:hover { border-color: rgba(95,217,255,0.5); }
  #nav select option { background: #0a1220; color: var(--text); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.45);
    padding: 12px 14px;
  }

  #info {
    top: 80px; left: 28px; width: 250px; display: none;
    font-size: 11.5px; line-height: 1.7;
  }
  #info h3 { margin-bottom: 6px; }
  .mini-btn {
    background: linear-gradient(90deg, rgba(95,217,255,0.25), rgba(201,160,255,0.25));
    border: 1px solid rgba(95,217,255,0.5); color: #eaf7ff; cursor: pointer;
    border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 600;
    letter-spacing: 1px; box-shadow: 0 0 14px rgba(95,217,255,0.4);
  }
  .mini-btn:active { transform: translateY(1px); }

  /* Floating focus button (bottom center) */
  #focus-btn {
    position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%);
    z-index: 30; background: rgba(8,14,26,0.85); border: 1px solid rgba(95,217,255,0.55);
    color: var(--text); border-radius: 22px; padding: 11px 22px;
    font-size: 13px; font-weight: 600; letter-spacing: 1px; cursor: pointer;
    box-shadow: 0 0 22px rgba(95,217,255,0.5); backdrop-filter: blur(8px);
    transition: opacity 0.3s ease, transform 0.15s ease;
  }
  #focus-btn:hover { transform: translateX(-50%) scale(1.04); }
  #focus-btn:active { transform: translateX(-50%) scale(0.98); }
  #focus-btn.hidden { opacity: 0; pointer-events: none; }

  /* Banner is tappable to cycle planets */
  #title { cursor: pointer; user-select: none; -webkit-user-select: none; pointer-events: auto; }

  #legend {
    bottom: 24px; left: 28px; width: 200px;
  }
  #legend h3 {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 9px; text-shadow: var(--glow);
  }
  .legend-row { display: flex; align-items: center; gap: 9px; font-size: 11.5px; margin-bottom: 6px; }
  .legend-row:last-child { margin-bottom: 0; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .legend-row .lbl { color: var(--muted); }

  #controls {
    bottom: 24px; left: 50%; transform: translateX(-50%);
    text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 1px;
  }
  #controls b { color: var(--text); font-weight: 600; }

  /* Speed control */
  #speed {
    bottom: 24px; right: 28px; width: 200px;
    pointer-events: auto;
  }
  #speed h3 {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px; text-shadow: var(--glow);
  }
  #speed .row { display: flex; align-items: center; gap: 10px; }
  #speed input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none; height: 4px;
    border-radius: 4px; background: rgba(95,217,255,0.25); outline: none;
  }
  #speed input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 15px; height: 15px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
    box-shadow: 0 0 10px rgba(95,217,255,0.7);
  }
  #speed input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border: none; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }
  #speed .val { font-size: 12px; color: var(--text); min-width: 44px; text-align: right; font-weight: 600; }
  #speed .lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

  /* Mobile app-style navigation drawer */
  #menu-btn {
    position: absolute; top: 18px; right: 16px; z-index: 40;
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--text); font-size: 20px; cursor: pointer;
    backdrop-filter: blur(8px); box-shadow: 0 4px 24px rgba(0,0,0,0.45);
    display: none; align-items: center; justify-content: center;
  }
  #menu-btn:active { transform: scale(0.95); }

  #drawer-scrim {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);
    transition: opacity 0.25s ease;
  }
  #drawer-scrim.hidden { opacity: 0; pointer-events: none; }

  #drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: rgba(8, 14, 26, 0.96);
    border-top: 1px solid var(--panel-border);
    border-radius: 20px 20px 0 0;
    backdrop-filter: blur(20px);
    box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
    display: flex; flex-direction: column;
    max-height: 78vh;
    transform: translateY(0);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #drawer.hidden { transform: translateY(105%); pointer-events: none; }

  .drawer-handle {
    width: 40px; height: 4px; border-radius: 4px;
    background: rgba(120,200,255,0.3); margin: 10px auto 4px;
  }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 18px 10px;
  }
  .drawer-title {
    font-size: 15px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent); text-shadow: var(--glow);
  }
  #drawer-close {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(95,217,255,0.12); border: 1px solid var(--panel-border);
    color: var(--text); font-size: 14px; cursor: pointer;
  }
  .drawer-search { padding: 0 18px 10px; }
  .drawer-search input {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    background: rgba(10,18,32,0.9); border: 1px solid var(--panel-border);
    color: var(--text); font-size: 14px; outline: none;
  }
  .drawer-search input:focus { border-color: rgba(95,217,255,0.6); }
  .drawer-search input::placeholder { color: var(--muted); }

  .drawer-list {
    flex: 1; overflow-y: auto; padding: 0 10px 18px;
    -webkit-overflow-scrolling: touch;
  }
  .drawer-group-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 12px 10px 6px;
  }
  .drawer-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px; border-radius: 10px; cursor: pointer;
    transition: background 0.15s ease;
  }
  .drawer-item:active { background: rgba(95,217,255,0.12); }
  .drawer-item .glyph {
    width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff;
  }
  .drawer-item .name { font-size: 14px; font-weight: 500; color: var(--text); flex: 1; }
  .drawer-item .meta { font-size: 11px; color: var(--muted); }
  .drawer-item .chev { color: var(--muted); font-size: 12px; }
  .drawer-item.current { background: rgba(95,217,255,0.1); }
  .drawer-item.current .name { color: var(--accent); }

  #veil {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 40%, #060b18 0%, #010208 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease;
  }
  #veil.hidden { opacity: 0; pointer-events: none; }
  #veil .logo {
    font-size: 22px; letter-spacing: 6px; text-transform: uppercase;
    color: #eaf7ff; text-shadow: 0 0 30px rgba(95,217,255,0.7);
    animation: pulse 2.2s ease-in-out infinite;
  }
  #veil .bar { margin-top: 26px; width: 240px; height: 3px; border-radius: 3px; background: rgba(95,217,255,0.15); overflow: hidden; }
  #veil .bar > div { height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, #5fd9ff, #c9a0ff); transition: width 0.4s ease; }
  #veil .status { margin-top: 16px; font-size: 11px; letter-spacing: 2px; color: var(--muted); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }

  @media (max-width: 720px) {
    #legend { width: 160px; }
    #title h1 { font-size: 15px; }
    #nav select { min-width: 140px; font-size: 12px; }
    #nav { top: 18px; right: 16px; }
    .view-ind { font-size: 10px; padding: 3px 8px; }
    #speed { width: 170px; }
    /* On mobile, replace the dropdown with the app-style drawer button */
    #nav { display: none; }
    #menu-btn { display: flex; }
    #title { top: 16px; left: 16px; }
    #title h1 { font-size: 13px; letter-spacing: 2px; }
    #title .sub { font-size: 9px; }
    .view-ind { font-size: 9px; padding: 3px 7px; margin-top: 6px; }
    #legend { display: none; }
    #controls { display: none; }
    #speed { bottom: 16px; right: 16px; width: 150px; }
    #speed h3 { font-size: 10px; }
    #info { top: 70px; left: 16px; width: 200px; font-size: 10.5px; }
    #focus-btn { bottom: 60px; font-size: 12px; padding: 10px 18px; }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="hud" id="title">
    <h1>Solar System</h1>
    <div class="sub">FULL-SCALE MODEL &middot; REAL ORBITAL DATA</div>
    <div class="view-ind"><span class="view-ind-icon" id="view-ind-icon">☀</span><span id="view-ind-text">Full Solar System</span></div>
  </div>

  <div class="hud" id="nav">
    <select id="planet-select">
      <option value="system" selected>☀ Full Solar System</option>
      <optgroup label="Planets">
        <option value="Mercury">Mercury</option>
        <option value="Venus">Venus</option>
        <option value="Earth">Earth</option>
        <option value="Mars">Mars</option>
        <option value="Jupiter">Jupiter</option>
        <option value="Saturn">Saturn</option>
        <option value="Uranus">Uranus</option>
        <option value="Neptune">Neptune</option>
      </optgroup>
      <optgroup label="Dwarf Planets">
        <option value="Ceres">Ceres</option>
        <option value="Pluto">Pluto</option>
        <option value="Haumea">Haumea</option>
        <option value="Makemake">Makemake</option>
        <option value="Eris">Eris</option>
      </optgroup>
      <optgroup label="Asteroids">
        <option value="Vesta">Vesta</option>
        <option value="Pallas">Pallas</option>
        <option value="Hygiea">Hygiea</option>
        <option value="Psyche">Psyche</option>
        <option value="Juno">Juno</option>
        <option value="Eunomia">Eunomia</option>
        <option value="Davida">Davida</option>
        <option value="Interamnia">Interamnia</option>
        <option value="Eros">Eros</option>
        <option value="Apophis">Apophis</option>
        <option value="Bennu">Bennu</option>
        <option value="Gaspra">Gaspra</option>
        <option value="Ida">Ida</option>
        <option value="Itokawa">Itokawa</option>
      </optgroup>
    </select>
  </div>

  <div class="hud panel" id="info"></div>

  <button id="focus-btn" class="hidden"></button>

  <!-- Mobile app-style navigation drawer -->
  <button id="menu-btn" aria-label="Open body list">☰</button>
  <div id="drawer-scrim" class="hidden"></div>
  <div id="drawer" class="hidden">
    <div class="drawer-handle"></div>
    <div class="drawer-head">
      <span class="drawer-title">Bodies</span>
      <button id="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer-search">
      <input id="drawer-search-input" type="search" placeholder="Search planets, moons, asteroids…" autocomplete="off" />
    </div>
    <div class="drawer-list" id="drawer-list"></div>
  </div>

  <div class="hud panel" id="legend">
    <h3>Legend</h3>
    <div class="legend-row"><div class="swatch" style="background:#ffd27a;box-shadow:0 0 10px #ffd27a"></div><div class="lbl">Sun</div></div>
    <div class="legend-row"><div class="swatch" style="background:#5fd9ff;box-shadow:0 0 10px #5fd9ff"></div><div class="lbl">Planets</div></div>
    <div class="legend-row"><div class="swatch" style="background:#c9a0ff;box-shadow:0 0 10px #c9a0ff"></div><div class="lbl">Moons</div></div>
    <div class="legend-row"><div class="swatch" style="background:#c8a878;box-shadow:0 0 10px #c8a878"></div><div class="lbl">Dwarf planets</div></div>
  </div>

  <div class="hud" id="controls">
    <b>Drag</b> orbit &middot; <b>Scroll / pinch</b> zoom &middot; <b>Tap</b> a body for detail &middot; <b>Space</b> pause
  </div>

  <div class="hud panel" id="speed">
    <h3>Time Speed</h3>
    <div class="row">
      <span class="lbl">Slow</span>
      <input type="range" id="speed-slider" min="0" max="100" value="20" />
      <span class="lbl">Fast</span>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:4px">
      <span class="val" id="speed-val">1 day/s</span>
    </div>
  </div>

  <div id="veil">
    <div class="logo">SOLAR SYSTEM</div>
    <div class="bar"><div id="veilbar"></div></div>
    <div class="status" id="veilstatus">Loading planetary data…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js",
      "three/addons/": "./lib/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
